[project]
name = "agente-soporte-correo"
version = "0.1.0"
description = "Demo local: agente de soporte por correo con LangGraph, RAG, aprobación humana y dashboard en vivo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langsmith>=0.4",
    "numpy>=1.26",  # InMemoryVectorStore la usa para la similitud coseno
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph-checkpoint-sqlite>=2.0",  # checkpoints en un archivo local, sin servidor de base de datos
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "langgraph-cli[inmem]>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soporte = ["web/*", "web/js/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
