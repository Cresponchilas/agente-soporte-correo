[project]
name = "agente-soporte-correo"
version = "0.1.0"
description = "Agente de soporte por correo con LangGraph: clasifica, busca en la base de conocimiento (RAG), crea tickets y pide aprobación humana."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langsmith>=0.4",
    "numpy>=1.26",  # InMemoryVectorStore la usa para la similitud coseno
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
]
dev = [
    "agente-soporte-correo[api]",
    "pytest>=8",
    "httpx>=0.27",
    "langgraph-cli[inmem]>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
